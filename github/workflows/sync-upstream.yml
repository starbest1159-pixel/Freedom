name: Sync from seriesjeen/web-seriesjeen-opensource

on:
  schedule:
    # ทุกชั่วโมง (ปรับ cron ตามต้องการ)
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote and fetch
        run: |
          # เปลี่ยน URL ถ้าจำเป็น
          UPSTREAM_REPO="https://github.com/seriesjeen/web-seriesjeen-opensource.git"
          git remote add upstream "$UPSTREAM_REPO" || true
          git fetch upstream --prune

      - name: Merge upstream into current branch
        env:
          TARGET_BRANCH: main
        run: |
          # ถ้า repo ใช้ master ให้เปลี่ยน TARGET_BRANCH เป็น master
          git switch -C "$TARGET_BRANCH" || git checkout -B "$TARGET_BRANCH"
          # พยายาม fast-forward ก่อน (ปลอดภัย) ถ้าไม่สำเร็จจะลองทำ merge แบบ non-interactive
          if git merge --ff-only "upstream/$TARGET_BRANCH"; then
            echo "Fast-forwarded successfully"
          else
            echo "Fast-forward failed, trying a non-interactive merge"
            git merge --no-edit "upstream/$TARGET_BRANCH" || (echo "Merge conflict or other error; aborting" && exit 1)
          fi

      - name: Push merged changes back to your repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD:"$TARGET_BRANCH"
